<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>小一英文闖關小遊戲</title>
  <style>
    :root {
      --bg-color: #f0f8ff;
      --primary: #FF9AA2;
      --secondary: #FFDAC1;
      --accent1: #E2F0CB;
      --accent2: #B5EAD7;
      --accent3: #C7CEEA;
      --text-dark: #4A4A4A;
      --correct: #4ade80;
      --wrong: #f87171;
    }

    * { box-sizing: border-box; font-family: 'Comic Sans MS', -apple-system, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent;}
    
    body {
      background-color: var(--bg-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      color: var(--text-dark);
    }

    .app-container {
      width: 100%;
      max-width: 800px;
      background: white;
      border-radius: 30px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
      padding: 30px;
      position: relative;
      overflow: hidden;
      min-height: 85vh;
    }

    /* 首頁選單 */
    #home-screen { display: block; text-align: center; }
    #home-screen h1 { font-size: 36px; color: #ff6b6b; margin-bottom: 10px; }
    #home-screen p { font-size: 20px; color: #888; margin-bottom: 30px; }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    @media (max-width: 600px) {
      .category-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .cat-btn {
      background-color: var(--secondary);
      border: none;
      border-radius: 20px;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
      color: var(--text-dark);
      cursor: pointer;
      box-shadow: 0 6px 0px rgba(0,0,0,0.1);
      transition: transform 0.1s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    
    .cat-btn:active { transform: translateY(6px); box-shadow: none; }
    .cat-btn span { font-size: 40px; }

    /* 遊戲畫面 */
    #game-screen { display: none; text-align: center; height: 100%; }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .back-btn {
      background: #eee;
      border: none;
      padding: 12px 24px;
      border-radius: 15px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .score-board {
      font-size: 24px;
      font-weight: bold;
      color: #ff9800;
      background: #fff3e0;
      padding: 10px 20px;
      border-radius: 20px;
    }

    .question-box {
      margin: 20px 0 40px 0;
    }

    .english-word {
      font-size: 64px;
      font-weight: 800;
      color: var(--accent3);
      margin-bottom: 15px;
      letter-spacing: 2px;
    }

    .audio-btn {
      background: var(--accent1);
      border: none;
      border-radius: 50%;
      width: 70px;
      height: 70px;
      font-size: 32px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .audio-btn:active { transform: scale(0.9); }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .opt-btn {
      background: white;
      border: 4px solid var(--accent2);
      border-radius: 25px;
      padding: 30px;
      font-size: 28px;
      font-weight: bold;
      color: var(--text-dark);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      transition: all 0.2s;
    }

    .opt-btn:active { transform: scale(0.95); }
    
    .correct { background: var(--correct); border-color: var(--correct); color: white; }
    .wrong { background: var(--wrong); border-color: var(--wrong); color: white; }

    /* 各類別顏色隨機設定 */
    .cat-btn:nth-child(3n+1) { background-color: var(--primary); color: white;}
    .cat-btn:nth-child(3n+2) { background-color: var(--accent2); }
    .cat-btn:nth-child(3n+3) { background-color: var(--secondary); }
  </style>
</head>
<body>

<div class="app-container">
  
  <!-- 首頁 -->
  <div id="home-screen">
    <h1>🌟 小一英文單字大冒險 🌟</h1>
    <p>請選擇一個主題開始闖關！</p>
    <div class="category-grid" id="cat-grid">
      <!-- 按鈕會由 JS 自動生成 -->
    </div>
  </div>

  <!-- 遊戲畫面 -->
  <div id="game-screen">
    <div class="header">
      <button class="back-btn" onclick="goHome()">🏠 返回</button>
      <div class="score-board">⭐ 得分: <span id="score">0</span></div>
    </div>
    
    <div class="question-box">
      <div class="english-word" id="en-word">Apple</div>
      <button class="audio-btn" onclick="playAudio()">🔊</button>
    </div>

    <div class="options-grid" id="options-area">
      <!-- 選項由 JS 生成 -->
    </div>
  </div>

</div>

<script>
  // 11大分類英文詞彙庫 (專為小一設計，配有 Emoji)
  const db = {
    school: { name: "學校", emoji: "🏫", words: [
      {en: "school", zh: "學校", em: "🏫"}, {en: "teacher", zh: "老師", em: "👩‍🏫"}, 
      {en: "student", zh: "學生", em: "🧒"}, {en: "classroom", zh: "課室", em: "🚪"},
      {en: "desk", zh: "書桌", em: "🪑"}, {en: "book", zh: "書本", em: "📖"},
      {en: "bag", zh: "書包", em: "🎒"}
    ]},
    month: { name: "月份", emoji: "📅", words: [
      {en: "January", zh: "一月", em: "1️⃣"}, {en: "February", zh: "二月", em: "2️⃣"},
      {en: "March", zh: "三月", em: "3️⃣"}, {en: "April", zh: "四月", em: "4️⃣"},
      {en: "May", zh: "五月", em: "5️⃣"}, {en: "June", zh: "六月", em: "6️⃣"},
      {en: "July", zh: "七月", em: "7️⃣"}, {en: "August", zh: "八月", em: "8️⃣"},
      {en: "September", zh: "九月", em: "9️⃣"}, {en: "October", zh: "十月", em: "🔟"},
      {en: "November", zh: "十一月", em: "1️⃣1️⃣"}, {en: "December", zh: "十二月", em: "1️⃣2️⃣"}
    ]},
    number: { name: "數字 1-20", emoji: "🔢", words: [
      {en: "one", zh: "一", em: "1"}, {en: "two", zh: "二", em: "2"}, {en: "three", zh: "三", em: "3"},
      {en: "four", zh: "四", em: "4"}, {en: "five", zh: "五", em: "5"}, {en: "six", zh: "六", em: "6"},
      {en: "seven", zh: "七", em: "7"}, {en: "eight", zh: "八", em: "8"}, {en: "nine", zh: "九", em: "9"},
      {en: "ten", zh: "十", em: "10"}, {en: "eleven", zh: "十一", em: "11"}, {en: "twelve", zh: "十二", em: "12"},
      {en: "thirteen", zh: "十三", em: "13"}, {en: "fourteen", zh: "十四", em: "14"}, {en: "fifteen", zh: "十五", em: "15"},
      {en: "sixteen", zh: "十六", em: "16"}, {en: "seventeen", zh: "十七", em: "17"}, {en: "eighteen", zh: "十八", em: "18"},
      {en: "nineteen", zh: "十九", em: "19"}, {en: "twenty", zh: "二十", em: "20"}
    ]},
    fruit: { name: "水果", emoji: "🍎", words: [
      {en: "apple", zh: "蘋果", em: "🍎"}, {en: "banana", zh: "香蕉", em: "🍌"}, 
      {en: "orange", zh: "橙", em: "🍊"}, {en: "grape", zh: "葡萄", em: "🍇"},
      {en: "watermelon", zh: "西瓜", em: "🍉"}, {en: "strawberry", zh: "士多啤梨", em: "🍓"},
      {en: "mango", zh: "芒果", em: "🥭"}, {en: "pear", zh: "梨", em: "🍐"}
    ]},
    animal: { name: "動物", emoji: "🐶", words: [
      {en: "dog", zh: "狗", em: "🐶"}, {en: "cat", zh: "貓", em: "🐱"}, 
      {en: "bird", zh: "鳥", em: "🐦"}, {en: "fish", zh: "魚", em: "🐟"},
      {en: "pig", zh: "豬", em: "🐷"}, {en: "elephant", zh: "大象", em: "🐘"},
      {en: "lion", zh: "獅子", em: "🦁"}, {en: "monkey", zh: "猴子", em: "🐵"}
    ]},
    food: { name: "食物", emoji: "🍔", words: [
      {en: "bread", zh: "麵包", em: "🍞"}, {en: "egg", zh: "雞蛋", em: "🥚"},
      {en: "meat", zh: "肉", em: "🥩"}, {en: "rice", zh: "飯", em: "🍚"},
      {en: "cake", zh: "蛋糕", em: "🍰"}, {en: "pizza", zh: "薄餅", em: "🍕"},
      {en: "cheese", zh: "芝士", em: "🧀"}, {en: "soup", zh: "湯", em: "🥣"}
    ]},
    vegetable: { name: "蔬菜", emoji: "🥦", words: [
      {en: "carrot", zh: "紅蘿蔔", em: "🥕"}, {en: "potato", zh: "馬鈴薯", em: "🥔"},
      {en: "tomato", zh: "番茄", em: "🍅"}, {en: "onion", zh: "洋蔥", em: "🧅"},
      {en: "corn", zh: "粟米", em: "🌽"}, {en: "mushroom", zh: "蘑菇", em: "🍄"}
    ]},
    color: { name: "顏色", emoji: "🎨", words: [
      {en: "red", zh: "紅色", em: "🔴"}, {en: "blue", zh: "藍色", em: "🔵"},
      {en: "green", zh: "綠色", em: "🟢"}, {en: "yellow", zh: "黃色", em: "🟡"},
      {en: "orange", zh: "橙色", em: "🟠"}, {en: "purple", zh: "紫色", em: "🟣"},
      {en: "black", zh: "黑色", em: "⚫"}, {en: "white", zh: "白色", em: "⚪"},
      {en: "pink", zh: "粉紅色", em: "🌸"}, {en: "brown", zh: "啡色", em: "🟤"}
    ]},
    family: { name: "家庭", emoji: "👨‍👩‍👧", words: [
      {en: "father", zh: "爸爸", em: "👨"}, {en: "mother", zh: "媽媽", em: "👩"},
      {en: "brother", zh: "兄弟", em: "👦"}, {en: "sister", zh: "姊妹", em: "👧"},
      {en: "grandfather", zh: "爺爺/公公", em: "👴"}, {en: "grandmother", zh: "嫲嫲/婆婆", em: "👵"},
      {en: "baby", zh: "嬰兒", em: "👶"}
    ]},
    clothes: { name: "衣服", emoji: "👕", words: [
      {en: "shirt", zh: "恤衫", em: "👔"}, {en: "T-shirt", zh: "T恤", em: "👕"},
      {en: "pants", zh: "長褲", em: "👖"}, {en: "skirt", zh: "裙子", em: "👗"},
      {en: "jacket", zh: "外套", em: "🧥"}, {en: "shoes", zh: "鞋子", em: "👞"},
      {en: "socks", zh: "襪子", em: "🧦"}, {en: "hat", zh: "帽子", em: "🧢"}
    ]},
    stationery: { name: "文具", emoji: "✏️", words: [
      {en: "pencil", zh: "鉛筆", em: "✏️"}, {en: "pen", zh: "原子筆", em: "🖊️"},
      {en: "eraser", zh: "擦膠", em: "🧽"}, {en: "ruler", zh: "間尺", em: "📏"},
      {en: "paper", zh: "紙張", em: "📄"}, {en: "scissors", zh: "剪刀", em: "✂️"},
      {en: "glue", zh: "膠水", em: "🧴"}
    ]}
  };

  let currentCategory = "";
  let currentWordObj = null;
  let score = 0;
  let isAnswering = false;

  // 初始化首頁選單
  function initMenu() {
    const grid = document.getElementById("cat-grid");
    grid.innerHTML = "";
    for (let key in db) {
      const btn = document.createElement("button");
      btn.className = "cat-btn";
      btn.innerHTML = `<span>${db[key].emoji}</span>${db[key].name}`;
      btn.onclick = () => startGame(key);
      grid.appendChild(btn);
    }
  }

  function goHome() {
    document.getElementById("home-screen").style.display = "block";
    document.getElementById("game-screen").style.display = "none";
    window.speechSynthesis.cancel();
  }

  function startGame(category) {
    currentCategory = category;
    score = 0;
    document.getElementById("score").innerText = score;
    document.getElementById("home-screen").style.display = "none";
    document.getElementById("game-screen").style.display = "block";
    
    // 改變標題顏色以符合分類
    const colors = ["#FF9AA2", "#B5EAD7", "#C7CEEA", "#FFDAC1"];
    document.getElementById("en-word").style.color = colors[Math.floor(Math.random()*colors.length)];

    nextQuestion();
  }

  function nextQuestion() {
    isAnswering = false;
    const words = db[currentCategory].words;
    
    // 隨機選出正確答案
    currentWordObj = words[Math.floor(Math.random() * words.length)];
    
    document.getElementById("en-word").innerText = currentWordObj.en;
    
    // 產生選項 (1對 3錯)
    let options = [currentWordObj];
    let attempts = 0;
    while(options.length < 4 && attempts < 50) {
      let randomOpt = words[Math.floor(Math.random() * words.length)];
      if(!options.includes(randomOpt)) {
        options.push(randomOpt);
      }
      attempts++;
    }

    // 打亂選項順序
    options.sort(() => Math.random() - 0.5);

    // 渲染按鈕
    const optArea = document.getElementById("options-area");
    optArea.innerHTML = "";
    options.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "opt-btn";
      btn.innerHTML = `<span>${opt.em}</span> ${opt.zh}`;
      btn.onclick = () => checkAnswer(btn, opt === currentWordObj);
      optArea.appendChild(btn);
    });

    // 自動朗讀英文
    setTimeout(playAudio, 300);
  }

  function checkAnswer(btn, isCorrect) {
    if (isAnswering) return; // 鎖定防止連按
    isAnswering = true;

    if (isCorrect) {
      btn.classList.add("correct");
      score += 10;
      document.getElementById("score").innerText = score;
      
      // 答對播放簡單提示音 (Web Audio API)
      playTone(600, "sine", 0.1);
      setTimeout(() => playTone(800, "sine", 0.15), 100);

      setTimeout(nextQuestion, 1200);
    } else {
      btn.classList.add("wrong");
      score = Math.max(0, score - 5);
      document.getElementById("score").innerText = score;
      
      // 答錯提示音
      playTone(200, "sawtooth", 0.3);
      
      // 找出並亮起正確答案
      const btns = document.querySelectorAll(".opt-btn");
      btns.forEach(b => {
        if(b.innerHTML.includes(currentWordObj.zh)) {
          b.classList.add("correct");
        }
      });

      setTimeout(nextQuestion, 2000);
    }
  }

  // 語音發聲功能 (Text-to-Speech)
  function playAudio() {
    if (!currentWordObj) return;
    window.speechSynthesis.cancel(); // 停止上一句
    const utterance = new SpeechSynthesisUtterance(currentWordObj.en);
    utterance.lang = 'en-US'; 
    utterance.rate = 0.85; // 放慢一點適合小學生
    utterance.pitch = 1.1; // 稍微高音一點更可愛
    window.speechSynthesis.speak(utterance);
  }

  // 簡單產生音效的函數，不需額外載入聲音檔案
  function playTone(frequency, type, duration) {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    
    oscillator.type = type;
    oscillator.frequency.value = frequency;
    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    
    oscillator.start();
    gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
    oscillator.stop(audioCtx.currentTime + duration);
  }

  // 啟動程式
  initMenu();

</script>

</body>
</html>
