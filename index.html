<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎒 升小一英文特訓</title>
    <style>
        :root {
            /* 莫蘭迪活潑配色 */
            --bg-dark: #1E232E;       
            --bg-card: #2A3143;       
            --primary: #82A0D8;       
            --text-main: #E2E8F0;     
            --text-muted: #94A3B8;    
            --accent: #F4A261;        
            --danger: #E76F51;
            --success: #2A9D8F;
            --tag-bg: rgba(130, 160, 216, 0.15);
        }

        body {
            font-family: "Comic Sans MS", "Chalkboard SE", -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .header {
            text-align: center;
            flex-shrink: 0;
            margin-bottom: 12px;
        }
        .header h2 {
            color: var(--accent);
            font-size: 22px;
            margin: 0 0 4px 0;
            letter-spacing: 1px;
        }
        .header p {
            color: var(--text-muted);
            font-size: 12px;
            margin: 0;
        }

        /* 頂部導航 Tabs */
        .tabs {
            display: flex;
            background: var(--bg-card);
            border-radius: 12px;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
            margin-bottom: 12px;
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px 2px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 2px 10px rgba(244, 162, 97, 0.3);
        }

        /* 內容區域 */
        .content-area {
            flex-grow: 1;
            overflow-y: auto;
            scrollbar-width: none;
            padding-bottom: 20px;
        }
        .content-area::-webkit-scrollbar { display: none; }
        
        .view-section { display: none; flex-direction: column; gap: 12px; height: 100%; }
        .view-section.active { display: flex; }

        /* ====== 1. Phonics 拼讀表 ====== */
        .alphabet-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding-bottom: 20px;
        }
        .letter-card {
            background: linear-gradient(145deg, #2A3143 0%, #202635 100%);
            border: 2px solid rgba(130, 160, 216, 0.2);
            border-radius: 14px;
            padding: 12px 0;
            text-align: center;
            cursor: pointer;
            transition: transform 0.1s, border-color 0.1s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .letter-card:active { 
            transform: scale(0.9); 
            border-color: var(--accent);
            background: rgba(244, 162, 97, 0.1);
        }
        .letter-char { font-size: 28px; font-weight: bold; color: var(--primary); line-height: 1;}
        .letter-word { font-size: 11px; color: var(--text-muted); }
        .letter-emoji { font-size: 24px; }

        /* ====== 2. 升小一閃卡 ====== */
        .flashcard-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }
        .flashcard {
            width: 100%;
            height: 280px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            cursor: pointer;
        }
        .flashcard.flipped { transform: rotateY(180deg); }
        
        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            background: linear-gradient(145deg, #2A3143 0%, #202635 100%);
            border-radius: 24px;
            border: 2px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .flashcard-back { 
            transform: rotateY(180deg); 
            background: linear-gradient(145deg, #202635 0%, #1a1e29 100%); 
            border-color: var(--accent); 
        }
        
        .fc-category { position: absolute; top: 16px; font-size: 12px; color: var(--text-main); background: var(--tag-bg); padding: 4px 12px; border-radius: 12px; font-weight: bold; }
        .fc-word { font-size: 36px; font-weight: bold; color: var(--text-main); margin-bottom: 8px; line-height: 1.2;}
        .fc-emoji { font-size: 70px; margin-bottom: 10px; }
        .fc-zh { font-size: 22px; color: var(--accent); font-weight: bold;}
        
        .fc-controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 10px;
            gap: 12px;
        }
        .fc-btn {
            flex: 1;
            background: var(--bg-card);
            border: 2px solid rgba(255,255,255,0.1);
            color: var(--text-main);
            padding: 16px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .fc-btn:active { background: rgba(255,255,255,0.1); }
        .fc-play { 
            background: var(--accent); 
            color: #fff; 
            border: none; 
            width: 60px;
            border-radius: 16px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 24px; 
            cursor: pointer;
        }

        /* ====== 3. 測驗 ====== */
        .quiz-box {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border: 2px solid rgba(255,255,255,0.05);
        }
        .quiz-question { font-size: 32px; font-weight: bold; color: var(--primary); line-height: 1.2;}
        .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .quiz-opt-btn {
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 16px;
            font-size: 48px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .quiz-opt-btn.correct { background: var(--success); border-color: var(--success); transform: scale(1.05);}
        .quiz-opt-btn.wrong { background: var(--danger); border-color: var(--danger); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🎒 升小一英文特訓</h2>
        <p>Phonics 拼讀 | 常見生字 | 基礎句子</p>
    </div>

    <!-- 導航列 -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('phonics', this)">🔤 Phonics</button>
        <button class="tab-btn" onclick="switchTab('flashcard', this)">📇 認字閃卡</button>
        <button class="tab-btn" onclick="switchTab('quiz', this)">🎈 聽音估圖</button>
    </div>

    <div class="content-area">
        <!-- 1. Phonics 表 -->
        <div id="view-phonics" class="view-section active">
            <div style="font-size: 12px; color: var(--text-muted); text-align:center;">💡 點擊卡片學習字母同自然發音 (例如: A, Apple)</div>
            <div class="alphabet-grid" id="phonicsGrid">
                <!-- JS 動態生成 -->
            </div>
        </div>

        <!-- 2. 升小一閃卡 -->
        <div id="view-flashcard" class="view-section">
            <div style="font-size: 12px; color: var(--text-muted); text-align:center;">💡 包含小一面試常見單字及簡單句子</div>
            <div class="flashcard-container">
                <div class="flashcard" id="fc-element" onclick="toggleFlashcard()">
                    <div class="flashcard-face">
                        <div class="fc-category" id="fc-category">學校 School</div>
                        <div class="fc-word" id="fc-word">Book</div>
                        <div style="opacity: 0.5; font-size: 12px; margin-top:20px;">👆 點擊翻看意思</div>
                    </div>
                    <div class="flashcard-face flashcard-back">
                        <div class="fc-emoji" id="fc-emoji">📖</div>
                        <div class="fc-zh" id="fc-zh">書本</div>
                    </div>
                </div>
            </div>
            <div class="fc-controls">
                <button class="fc-btn" onclick="prevCard()">⬅️ 上一題</button>
                <button class="fc-play" onclick="playCurrentWord()">🔊</button>
                <button class="fc-btn" onclick="nextCard()">下一題 ➡️</button>
            </div>
        </div>

        <!-- 3. 聽音估圖 -->
        <div id="view-quiz" class="view-section">
            <div class="quiz-box">
                <div style="font-size: 13px; color: var(--text-muted);">🔊 聽發音，選出正確的圖案！</div>
                <div class="quiz-question" id="quizQuestion">Book</div>
                <div class="quiz-options" id="quizOptions"></div>
            </div>
            <button class="fc-btn" style="width: 100%; margin-top: 10px;" onclick="nextQuiz()">⏭️ 下一題</button>
        </div>
    </div>
</div>

<script>
    // --- 智能語音引擎 (TTS) ---
    function speak(text, lang = 'en-US', rate = 0.8) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = lang; 
            msg.rate = rate; 
            window.speechSynthesis.speak(msg);
        }
    }

    // --- 數據庫 ---
    // 升小一 Phonics 基礎
    const phonicsData = [
        { l: 'A', w: 'Apple', e: '🍎' }, { l: 'B', w: 'Bear', e: '🐻' },
        { l: 'C', w: 'Cat', e: '🐱' }, { l: 'D', w: 'Dog', e: '🐶' },
        { l: 'E', w: 'Egg', e: '🥚' }, { l: 'F', w: 'Fish', e: '🐟' },
        { l: 'G', w: 'Grape', e: '🍇' }, { l: 'H', w: 'Hat', e: '🎩' },
        { l: 'I', w: 'Ice', e: '🧊' }, { l: 'J', w: 'Juice', e: '🧃' },
        { l: 'K', w: 'Key', e: '🔑' }, { l: 'L', w: 'Lion', e: '🦁' },
        { l: 'M', w: 'Monkey', e: '🐵' }, { l: 'N', w: 'Nut', e: '🥜' },
        { l: 'O', w: 'Orange', e: '🍊' }, { l: 'P', w: 'Pig', e: '🐷' },
        { l: 'Q', w: 'Queen', e: '👑' }, { l: 'R', w: 'Rabbit', e: '🐰' },
        { l: 'S', w: 'Sun', e: '☀️' }, { l: 'T', w: 'Tiger', e: '🐯' },
        { l: 'U', w: 'Umbrella', e: '☔' }, { l: 'V', w: 'Van', e: '🚐' },
        { l: 'W', w: 'Water', e: '💧' }, { l: 'X', w: 'X-ray', e: '🦴' },
        { l: 'Y', w: 'Yo-yo', e: '🪀' }, { l: 'Z', w: 'Zebra', e: '🦓' }
    ];

    // 升小一必學單字及句子
    const vocabData = [
        // 學校 School
        { cat: '學校 School', en: 'Book', zh: '書本', emoji: '📖' },
        { cat: '學校 School', en: 'Pencil', zh: '鉛筆', emoji: '✏️' },
        { cat: '學校 School', en: 'Bag', zh: '書包', emoji: '🎒' },
        // 家庭 Family
        { cat: '家庭 Family', en: 'Father', zh: '爸爸', emoji: '👨' },
        { cat: '家庭 Family', en: 'Mother', zh: '媽媽', emoji: '👩' },
        { cat: '家庭 Family', en: 'Baby', zh: 'BB', emoji: '👶' },
        // 身體 Body
        { cat: '身體 Body', en: 'Eye', zh: '眼睛', emoji: '👁️' },
        { cat: '身體 Body', en: 'Ear', zh: '耳朵', emoji: '👂' },
        { cat: '身體 Body', en: 'Nose', zh: '鼻子', emoji: '👃' },
        // 常見簡單句子 (Sight Words & Sentences)
        { cat: '簡單句子 Sentences', en: 'This is an apple.', zh: '這是一個蘋果。', emoji: '🍎' },
        { cat: '簡單句子 Sentences', en: 'I like dogs.', zh: '我喜歡狗。', emoji: '🐶' },
        { cat: '簡單句子 Sentences', en: 'It is a book.', zh: '這是一本書。', emoji: '📖' },
        { cat: '簡單句子 Sentences', en: 'I am happy.', zh: '我很開心。', emoji: '😄' },
        { cat: '簡單句子 Sentences', en: 'Good morning.', zh: '早晨。', emoji: '☀️' }
    ];

    // --- Tab 切換 ---
    function switchTab(viewId, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
        document.getElementById('view-' + viewId).classList.add('active');
        
        if (viewId === 'quiz') nextQuiz();
    }

    // --- 1. Phonics 邏輯 ---
    function renderPhonics() {
        const grid = document.getElementById('phonicsGrid');
        grid.innerHTML = '';
        phonicsData.forEach(item => {
            const div = document.createElement('div');
            div.className = 'letter-card';
            div.innerHTML = `
                <div class="letter-char">${item.l}</div>
                <div class="letter-emoji">${item.e}</div>
                <div class="letter-word">${item.w}</div>
            `;
            // 點擊時讀出: "A... Apple"
            div.onclick = () => speak(item.l + ', ' + item.w, 'en-US', 0.8);
            grid.appendChild(div);
        });
    }

    // --- 2. 閃卡邏輯 ---
    let currentCardIdx = 0;
    
    function loadFlashcard() {
        const card = document.getElementById('fc-element');
        card.classList.remove('flipped');
        
        setTimeout(() => {
            const data = vocabData[currentCardIdx];
            document.getElementById('fc-category').innerText = data.cat;
            document.getElementById('fc-word').innerText = data.en;
            document.getElementById('fc-emoji').innerText = data.emoji;
            document.getElementById('fc-zh').innerText = data.zh;
        }, 150);
    }

    function toggleFlashcard() { 
        const card = document.getElementById('fc-element');
        const isFlipped = card.classList.toggle('flipped'); 
        const data = vocabData[currentCardIdx];

        if (isFlipped) { speak(data.zh, 'zh-HK', 0.9); } 
        else { speak(data.en, 'en-US', 0.8); }
    }

    function prevCard() { 
        currentCardIdx = (currentCardIdx - 1 + vocabData.length) % vocabData.length; 
        loadFlashcard(); 
        speak(vocabData[currentCardIdx].en, 'en-US', 0.8);
    }

    function nextCard() { 
        currentCardIdx = (currentCardIdx + 1) % vocabData.length; 
        loadFlashcard(); 
        speak(vocabData[currentCardIdx].en, 'en-US', 0.8);
    }

    function playCurrentWord() { 
        speak(vocabData[currentCardIdx].en, 'en-US', 0.8); 
    }

    // --- 3. 測驗邏輯 ---
    let correctEmoji = '';

    function nextQuiz() {
        const optionsBox = document.getElementById('quizOptions');
        optionsBox.innerHTML = '';
        
        const correctItem = vocabData[Math.floor(Math.random() * vocabData.length)];
        document.getElementById('quizQuestion').innerText = correctItem.en;
        correctEmoji = correctItem.emoji;
        
        let options = [correctEmoji];
        
        while (options.length < 4) {
            const wrongItem = vocabData[Math.floor(Math.random() * vocabData.length)];
            if (!options.includes(wrongItem.emoji)) {
                options.push(wrongItem.emoji);
            }
        }

        options.sort(() => Math.random() - 0.5);

        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'quiz-opt-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, opt);
            optionsBox.appendChild(btn);
        });
        
        speak(correctItem.en, 'en-US', 0.8);
    }

    function checkAnswer(btn, selected) {
        if (btn.classList.contains('correct') || btn.classList.contains('wrong')) return;
        
        if (selected === correctEmoji) {
            btn.classList.add('correct');
            if (navigator.vibrate) navigator.vibrate([50, 50]);
            speak("Good job!", 'en-US', 1.0); 
            setTimeout(nextQuiz, 1500); 
        } else {
            btn.classList.add('wrong');
            if (navigator.vibrate) navigator.vibrate(200); 
            speak("Try again", 'en-US', 1.0);
        }
    }

    // 初始化
    renderPhonics();
    loadFlashcard();
</script>

</body>
</html>
