<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>小一英文溫習與闖關 App (面試生字版)</title>
  <style>
    :root {
      --bg-color: #f0f8ff;
      --primary: #FF9AA2;
      --secondary: #FFDAC1;
      --accent1: #E2F0CB;
      --accent2: #B5EAD7;
      --accent3: #C7CEEA;
      --text-dark: #4A4A4A;
      --correct: #4ade80;
      --wrong: #f87171;
    }

    * { box-sizing: border-box; font-family: 'Comic Sans MS', -apple-system, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent;}
    
    body {
      background-color: var(--bg-color);
      margin: 0;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      color: var(--text-dark);
    }

    .app-container {
      width: 100%;
      max-width: 900px;
      background: white;
      border-radius: 30px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
      padding: 40px;
      position: relative;
      overflow: hidden;
      min-height: 85vh;
    }

    /* 首頁選單 */
    #home-screen { display: block; text-align: center; }
    #home-screen h1 { font-size: 42px; color: #ff6b6b; margin-bottom: 10px; }
    #home-screen p { font-size: 24px; color: #888; margin-bottom: 40px; }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .cat-btn {
      background-color: var(--secondary);
      border: none;
      border-radius: 25px;
      padding: 25px 20px;
      font-size: 26px;
      font-weight: bold;
      color: var(--text-dark);
      cursor: pointer;
      box-shadow: 0 8px 0px rgba(0,0,0,0.1);
      transition: transform 0.1s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    .cat-btn:active { transform: translateY(8px); box-shadow: none; }
    .cat-btn span { font-size: 50px; }

    /* 各類別顏色隨機設定 */
    .cat-btn:nth-child(4n+1) { background-color: var(--primary); color: white;}
    .cat-btn:nth-child(4n+2) { background-color: var(--accent2); }
    .cat-btn:nth-child(4n+3) { background-color: var(--secondary); }
    .cat-btn:nth-child(4n+4) { background-color: var(--accent3); color: white;}

    /* 模式選擇畫面 */
    #mode-screen { display: none; text-align: center; height: 100%; padding-top: 50px; }
    #mode-screen h2 { font-size: 46px; color: var(--text-dark); margin-bottom: 60px; }
    .mode-options { display: flex; justify-content: center; gap: 40px; }
    .mode-btn {
      border: none; border-radius: 30px; padding: 50px 40px; font-size: 40px; font-weight: bold;
      cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,0.15); transition: transform 0.1s;
      display: flex; flex-direction: column; align-items: center; gap: 20px; width: 300px;
    }
    .mode-btn:active { transform: scale(0.95); }
    .btn-study { background-color: var(--accent1); color: #333; }
    .btn-game { background-color: var(--primary); color: white; }

    /* 共用頭部 */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .back-btn { background: #eee; border: none; padding: 15px 30px; border-radius: 20px; font-size: 22px; font-weight: bold; cursor: pointer; }
    .header-title { font-size: 28px; font-weight: bold; color: var(--accent3); }

    /* 溫習畫面 (閃卡) */
    #study-screen { display: none; text-align: center; height: 100%; }
    .flashcard {
      background: white; border: 8px solid var(--accent3); border-radius: 40px;
      padding: 60px 40px; margin: 0 auto; max-width: 600px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.08); position: relative;
    }
    .fc-progress { position: absolute; top: 20px; right: 30px; font-size: 20px; color: #aaa; font-weight: bold; }
    .fc-emoji { font-size: 120px; margin-bottom: 20px; line-height: 1; }
    .fc-en { font-size: 72px; font-weight: 800; color: var(--text-dark); margin-bottom: 10px; letter-spacing: 2px; }
    .fc-zh { font-size: 40px; color: #888; margin-bottom: 40px; }
    
    .nav-btns { display: flex; justify-content: center; align-items: center; gap: 40px; margin-top: 40px; }
    .nav-btn { 
      font-size: 40px; background: var(--secondary); border: none; border-radius: 50%; 
      width: 90px; height: 90px; cursor: pointer; box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      display: flex; justify-content: center; align-items: center;
    }
    .nav-btn:active { transform: scale(0.9); }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

    /* 遊戲畫面 */
    #game-screen { display: none; text-align: center; height: 100%; }
    .score-board { font-size: 28px; font-weight: bold; color: #ff9800; background: #fff3e0; padding: 12px 25px; border-radius: 25px; }
    .question-box { margin: 10px 0 40px 0; }
    .english-word { font-size: 72px; font-weight: 800; color: var(--accent3); margin-bottom: 20px; letter-spacing: 2px; }
    .audio-btn {
      background: var(--accent1); border: none; border-radius: 50%; width: 90px; height: 90px;
      font-size: 40px; cursor: pointer; box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    }
    .audio-btn:active { transform: scale(0.9); }
    .options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 25px; }
    .opt-btn {
      background: white; border: 5px solid var(--accent2); border-radius: 30px; padding: 35px 20px;
      font-size: 32px; font-weight: bold; color: var(--text-dark); cursor: pointer;
      display: flex; justify-content: center; align-items: center; gap: 20px; transition: all 0.2s;
    }
    .opt-btn:active { transform: scale(0.95); }
    .correct { background: var(--correct); border-color: var(--correct); color: white; }
    .wrong { background: var(--wrong); border-color: var(--wrong); color: white; }

  </style>
</head>
<body>

<div class="app-container">
  
  <!-- 1. 首頁：選擇分類 -->
  <div id="home-screen">
    <h1>🌟 小一面試單字大冒險 🌟</h1>
    <p>請選擇一個主題開始！</p>
    <div class="category-grid" id="cat-grid"></div>
  </div>

  <!-- 2. 模式選擇畫面 -->
  <div id="mode-screen">
    <div class="header">
      <button class="back-btn" onclick="goHome()">🏠 返回</button>
      <div class="header-title" id="mode-title">主題</div>
      <div style="width:100px;"></div> <!-- 佔位符保持置中 -->
    </div>
    <h2>你想做什麼？</h2>
    <div class="mode-options">
      <button class="mode-btn btn-study" onclick="startStudy()">
        <span style="font-size: 80px;">📖</span>溫習模式
      </button>
      <button class="mode-btn btn-game" onclick="startQuiz()">
        <span style="font-size: 80px;">🎮</span>闖關模式
      </button>
    </div>
  </div>

  <!-- 3. 溫習畫面 (閃卡) -->
  <div id="study-screen">
    <div class="header">
      <button class="back-btn" onclick="goModeSelect()">⬅️ 選模式</button>
      <div class="header-title">📖 溫習中</div>
      <div style="width:100px;"></div>
    </div>
    
    <div class="flashcard">
      <div class="fc-progress" id="fc-progress">1 / 10</div>
      <div class="fc-emoji" id="fc-emoji">🍎</div>
      <div class="fc-en" id="fc-en">Apple</div>
      <div class="fc-zh" id="fc-zh">蘋果</div>
      <button class="audio-btn" onclick="playAudio()">🔊</button>
    </div>

    <div class="nav-btns">
      <button class="nav-btn" id="btn-prev" onclick="prevCard()">◀️</button>
      <button class="nav-btn" id="btn-next" onclick="nextCard()">▶️</button>
    </div>
  </div>

  <!-- 4. 遊戲畫面 -->
  <div id="game-screen">
    <div class="header">
      <button class="back-btn" onclick="goModeSelect()">⬅️ 選模式</button>
      <div class="score-board">⭐ 得分: <span id="score">0</span></div>
    </div>
    
    <div class="question-box">
      <div class="english-word" id="en-word">Word</div>
      <button class="audio-btn" onclick="playAudio()">🔊</button>
    </div>

    <div class="options-grid" id="options-area"></div>
  </div>

</div>

      {en: "plane", zh: "飛機", em: "✈️"}, {en: "boat", zh: "船", em: "⛵"}, {en: "bicycle", zh: "單車", em: "🚲"},
      {en: "truck", zh: "卡車", em: "🚚"}, {en: "taxi", zh: "的士", em: "🚕"}, {en: "motorcycle", zh: "電單車", em: "🏍️"}, {en: "tram", zh: "電車", em: "🚋"}
    ]}

  let currentCategory = "";
  let currentWordObj = null;
  let score = 0;
  let isAnswering = false;
  let studyIndex = 0;

  // 隱藏所有畫面
  function hideAllScreens() {
    document.getElementById("home-screen").style.display = "none";
    document.getElementById("mode-screen").style.display = "none";
    document.getElementById("study-screen").style.display = "none";
    document.getElementById("game-screen").style.display = "none";
    window.speechSynthesis.cancel();
  }

  // 首頁初始化
  function initMenu() {
    const grid = document.getElementById("cat-grid");
    grid.innerHTML = "";
    for (let key in db) {
      const btn = document.createElement("button");
      btn.className = "cat-btn";
      btn.innerHTML = `<span>${db[key].emoji}</span>${db[key].name}`;
      btn.onclick = () => showModeSelect(key);
      grid.appendChild(btn);
    }
  }

  // 返回主頁
  function goHome() {
    hideAllScreens();
    document.getElementById("home-screen").style.display = "block";
  }

  // 進入模式選擇畫面
  function showModeSelect(category) {
    if(category) currentCategory = category;
    hideAllScreens();
    document.getElementById("mode-title").innerText = `${db[currentCategory].emoji} ${db[currentCategory].name}`;
    document.getElementById("mode-screen").style.display = "block";
  }

  // 返回模式選擇
  function goModeSelect() {
    showModeSelect(null);
  }

  // ================= 溫習模式邏輯 =================
  function startStudy() {
    hideAllScreens();
    studyIndex = 0;
    document.getElementById("study-screen").style.display = "block";
    renderFlashcard();
  }

  function renderFlashcard() {
    const words = db[currentCategory].words;
    currentWordObj = words[studyIndex];
    let displayWord = currentWordObj.en.charAt(0).toUpperCase() + currentWordObj.en.slice(1);

    document.getElementById("fc-emoji").innerText = currentWordObj.em;
    document.getElementById("fc-en").innerText = displayWord;
    document.getElementById("fc-zh").innerText = currentWordObj.zh;
    document.getElementById("fc-progress").innerText = `${studyIndex + 1} / ${words.length}`;

    // 更新按鈕狀態
    document.getElementById("btn-prev").disabled = (studyIndex === 0);
    document.getElementById("btn-next").disabled = (studyIndex === words.length - 1);

    // 換卡時自動發聲
    setTimeout(playAudio, 300);
  }

  function nextCard() {
    if (studyIndex < db[currentCategory].words.length - 1) {
      studyIndex++;
      renderFlashcard();
    }
  }

  function prevCard() {
    if (studyIndex > 0) {
      studyIndex--;
      renderFlashcard();
    }
  }

  // ================= 闖關模式邏輯 =================
  function startQuiz() {
    hideAllScreens();
    score = 0;
    document.getElementById("score").innerText = score;
    document.getElementById("game-screen").style.display = "block";
    
    const colors = ["#FF9AA2", "#B5EAD7", "#C7CEEA", "#FFDAC1"];
    document.getElementById("en-word").style.color = colors[Math.floor(Math.random()*colors.length)];
    
    nextQuestion();
  }

  function nextQuestion() {
    isAnswering = false;
    const words = db[currentCategory].words;
    currentWordObj = words[Math.floor(Math.random() * words.length)];
    let displayWord = currentWordObj.en.charAt(0).toUpperCase() + currentWordObj.en.slice(1);
    document.getElementById("en-word").innerText = displayWord;
    
    let options = [currentWordObj];
    let attempts = 0;
    while(options.length < 4 && attempts < 50) {
      let randomOpt = words[Math.floor(Math.random() * words.length)];
      if(!options.includes(randomOpt)) options.push(randomOpt);
      attempts++;
    }

    options.sort(() => Math.random() - 0.5);

    const optArea = document.getElementById("options-area");
    optArea.innerHTML = "";
    options.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "opt-btn";
      btn.innerHTML = `<span>${opt.em}</span> ${opt.zh}`;
      btn.onclick = () => checkAnswer(btn, opt === currentWordObj);
      optArea.appendChild(btn);
    });

    setTimeout(playAudio, 300);
  }

  function checkAnswer(btn, isCorrect) {
    if (isAnswering) return; 
    isAnswering = true;

    if (isCorrect) {
      btn.classList.add("correct");
      score += 10;
      document.getElementById("score").innerText = score;
      playTone(600, "sine", 0.1);
      setTimeout(() => playTone(800, "sine", 0.15), 100);
      setTimeout(nextQuestion, 1200);
    } else {
      btn.classList.add("wrong");
      score = Math.max(0, score - 5);
      document.getElementById("score").innerText = score;
      playTone(200, "sawtooth", 0.3);
      
      const btns = document.querySelectorAll(".opt-btn");
      btns.forEach(b => {
        if(b.innerHTML.includes(currentWordObj.zh)) b.classList.add("correct");
      });
      setTimeout(nextQuestion, 2000);
    }
  }

  // ================= 共用語音及音效 =================
  function playAudio() {
    if (!currentWordObj) return;
    window.speechSynthesis.cancel(); 
    const utterance = new SpeechSynthesisUtterance(currentWordObj.en);
    utterance.lang = 'en-US'; 
    utterance.rate = 0.85; 
    utterance.pitch = 1.1; 
    window.speechSynthesis.speak(utterance);
  }

  function playTone(frequency, type, duration) {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    
    oscillator.type = type;
    oscillator.frequency.value = frequency;
    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    
    oscillator.start();
    gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
    oscillator.stop(audioCtx.currentTime + duration);
  }

  // 啟動程式
  initMenu();

</script>
</body>
</html>
